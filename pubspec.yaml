name: liqaa_app
description: "LIQAA - Phonological and Phonemic Awareness Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^8.0.3

  # Navigation & Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1

  # Local Storage & Security
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4

  # Localization & Responsive UI
  easy_localization: ^3.0.7
  flutter_screenutil: ^5.9.3

  # Visual, SVG & Motion
  flutter_svg: ^2.0.17
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  confetti: ^0.8.0

  cupertino_icons: ^1.0.8
  record: ^6.2.1
  audioplayers: ^6.7.1
  path_provider: ^2.1.6
  permission_handler: 12.0.3
  share_plus: ^12.0.2
  sherpa_onnx: ^2.0.3
  rive: 0.14.11
  ffi: ^2.2.0

dependency_overrides:
  permission_handler_android: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  # Launcher Icons & Native Splash
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/branding/launcher/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/branding/launcher/app_icon_background.png"
  adaptive_icon_foreground: "assets/branding/launcher/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/launcher/app_icon_monochrome.png"
  web:
    generate: true
    image_path: "assets/branding/launcher/app_icon.png"
  windows:
    generate: true
    image_path: "assets/branding/launcher/app_icon.png"

flutter_native_splash:
  color: "#FFF7EA"
  color_dark: "#FFF7EA"
  image: "assets/branding/launcher/app_icon.png"
  branding: "assets/branding/logo/liqaa_logo.png"
  android_12:
    color: "#FFF7EA"
    image: "assets/branding/launcher/app_icon_foreground.png"
    icon_background_color: "#FFF7EA"
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/branding/logo/
    - assets/branding/launcher/
    - assets/branding/splash/
    - assets/images/yasser/original/
    - assets/images/yasser/poses/
    - assets/images/illustrations/
    - assets/translations/
    - assets/ai_models/silero/
    - assets/ai_models/gtcrn/
    - assets/ai_models/rnnoise/
    - assets/ai_models/whisper_tiny/
    - assets/ai_models/wav2vec2_espeak/
    - assets/ai_models/zipformer_v3/
    - assets/ai_models/zipformer_v2/
    - assets/pronunciation/
    - assets/audio_samples/
    - assets/pronunciation/prompts/
    - assets/rive/
